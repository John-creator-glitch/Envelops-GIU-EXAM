<!-- Envelope Tracker scan page. Put this file, named index.html, on GitHub Pages. Nothing inside needs editing. -->
<!doctype html><html><head><meta charset="utf-8"><meta name="app" content="envelope-tracker-page"><title>Envelope Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f3f6f4;color:#1b2b24;-webkit-text-size-adjust:100%}
.c{max-width:480px;margin:0 auto;padding:12px 14px 40px}h1{font-size:19px;margin:6px 0 2px;line-height:1.25}.sub{font-size:13px;color:#4a5a52}.id{font-size:11px;color:#8a968f;word-break:break-all;margin-top:2px}
.steps{display:flex;gap:6px;margin:12px 0 8px}.stp{flex:1;text-align:center;font-size:11px;padding:8px 2px;border-radius:8px;background:#e3e8e5;color:#7a867f;font-weight:bold}
.stp.done{background:#0e3b2e;color:#fff}.stp.now{background:#fff;color:#0e3b2e;border:2px solid #0e3b2e}
.box{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #eee;font-size:14px}.row:last-child{border:0}.row b{text-align:right}
.msg{position:sticky;top:0;z-index:5;padding:12px;border-radius:10px;font-weight:bold;font-size:15px;margin:8px 0;display:none}
.msg.ok{display:block;background:#d9ead3;color:#0b3d1c}.msg.err{display:block;background:#f8d7d3;color:#7a1410}
button{width:100%;font-size:18px;padding:16px;margin:6px 0 0;border:0;border-radius:10px;background:#0e3b2e;color:#fff;font-weight:bold}button:disabled{background:#9aa8a1}
.lnk{background:none;color:#0e3b2e;font-size:14px;font-weight:normal;text-decoration:underline;padding:10px;margin-top:2px}
a.lk{display:block;text-align:center;color:#0e3b2e;font-size:14px;padding:12px;text-decoration:underline}
label{display:block;font-size:14px;margin:10px 0 4px;color:#35453d}input{width:100%;font-size:20px;padding:11px;border:1px solid #99a;border-radius:8px}
.chk{font-size:14px;font-weight:bold;margin:10px 0 2px;min-height:20px}.chk.good{color:#1b6b2f}.chk.bad{color:#b3261e}
.big{font-size:17px;text-align:center;padding:6px}.hint{font-size:12px;color:#7a867f;margin-top:6px}.warn{font-size:13px;color:#7a1410;background:#f8d7d3;border-radius:8px;padding:8px;margin:6px 0}
a.res{display:block;text-decoration:none;color:inherit;border:1px solid #d5ddd8;border-radius:10px;padding:10px;margin:8px 0}a.res b{display:block;font-size:15px}a.res span{font-size:12px;color:#4a5a52;display:block}
</style></head><body><div class="c"><div id="app"><p style="padding:30px 0;text-align:center">Loading...</p></div></div>
<script>
/* Stand-in for google.script.run: each call goes to the Apps Script web app named in the link (?a=...) as plain text. No Google page is opened on the phone. */
var Q=new URLSearchParams(location.search),API='https://script.google.com/macros/s/'+(Q.get('a')||'')+'/exec';
(function(){
  function mk(ok,bad){return new Proxy({},{get:function(t,n){
    if(n==='withSuccessHandler')return function(f){return mk(f,bad)};
    if(n==='withFailureHandler')return function(f){return mk(ok,f)};
    return function(){var args=Array.prototype.slice.call(arguments);
      var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},45000);
      fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:n,args:args}),credentials:'omit',redirect:'follow',signal:ctl.signal})
      .then(function(r){return r.json()})
      .then(function(j){clearTimeout(to);if(j&&j.ok){if(ok)ok(j.result)}else{throw new Error((j&&j.error)||'The server did not accept the request.')}})
      .catch(function(e){clearTimeout(to);var m=(e&&e.name==='AbortError')?'The server took too long. Check the internet and try again.':(e&&e.message==='Failed to fetch'?'Could not reach the server. Check the internet and try again.':(e&&e.message)||String(e));if(bad)bad({message:m});});};}})}
  window.google={script:{run:mk(null,null)}};
})();
</script>
<script>
var ID=Q.get('e')||'',KEY=Q.get('k')||'',A=Q.get('a')||'';
var $=function(x){return document.getElementById(x)};
var o=null,busy=false,showFix=false,msg='',kind='',res=null;
var emp='',empName='',empNote='',eState='',eCan=false;
var S={emp:'',n:'',a:'0',m:'',tn:'',st:'',pin:'',q:'',d:''};
try{emp=localStorage.getItem('envEmp')||''}catch(e){}
S.emp=emp;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function row(a,b){return '<div class="row"><span>'+esc(a)+'</span><b>'+esc(b)+'</b></div>'}
function grab(){for(var k in S){var e=$('f_'+k);if(e)S[k]=e.value}}
function say(m,k){msg=m;kind=k||'';render();window.scrollTo(0,0)}
function fail(e){busy=false;say('Error: '+(e&&e.message?e.message:e),'err')}
function setBusy(b){busy=b;var bs=document.getElementsByTagName('button');for(var i=0;i<bs.length;i++)bs[i].disabled=b;var p=$('go');if(p&&b)p.textContent='Saving...'}
function setInfo(r){o=r;S.n=(r.sheets===''||r.sheets==null)?'':String(r.sheets);S.a=(r.absent===''||r.absent==null)?'0':String(r.absent);S.m=''}
/* ---- employee identity (one login, remembered on this phone) ---- */
function applyEmp(r){if(r.found){eState='found';empName=r.name;empNote=r.source==='Listed'?'':'Self-registered, not yet verified by the Exam Office'}else{eState='new';eCan=r.canRegister===true}}
function eLookup(){
  grab();emp=S.emp.trim();try{localStorage.setItem('envEmp',emp)}catch(e){}
  if(!emp){say('Enter your employee code.','err');return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;msg='';kind='';applyEmp(r);render()}).withFailureHandler(fail).teacherLookup(emp,ID,KEY);
}
function eRegister(){
  grab();if(!S.tn.trim()){say('Enter your full name.','err');return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;if(r.ok){eState='found';empName=r.name;empNote=r.source==='Listed'?'':'Self-registered, not yet verified by the Exam Office';msg='';kind=''}else{msg=r.msg;kind='err'}render()}).withFailureHandler(fail).teacherRegister(emp,S.tn.trim(),ID,KEY);
}
function eChange(){eState='';empName='';empNote='';res=null;render()}
function idBox(inner){
  var h='<div class="box">';
  if(eState==='found')h+=row('Employee',empName+' ('+emp+')')+(empNote?'<div class="hint">'+esc(empNote)+'</div>':'')+inner+'<button class="lnk" onclick="eChange()">Not you? Change employee code</button>';
  else if(eState==='new'&&!eCan)h+='<div class="hint" style="margin:0 0 6px">Employee code '+esc(emp)+' is not in the teachers list. '+(ID?'Please contact the Exam Office to have your code added.':'Scan any envelope QR once to register, or ask the Exam Office.')+'</div><button class="lnk" onclick="eChange()">Wrong code? Go back</button>';
  else if(eState==='new')h+='<div class="hint" style="margin:0 0 6px">Employee code '+esc(emp)+' is not in the teachers list. Register yourself once:</div><label for="f_tn">Your full name</label><input id="f_tn" type="text" style="font-size:16px" value="'+esc(S.tn)+'"><button id="go" onclick="eRegister()">Register and continue</button><button class="lnk" onclick="eChange()">Wrong code? Go back</button>';
  else h+='<label for="f_emp">Your employee code (required)</label><input id="f_emp" type="text" autocomplete="off" autocapitalize="off" value="'+esc(S.emp)+'"><button id="go" onclick="eLookup()">Continue</button>';
  return h+'</div>';
}
/* ---- live checks ---- */
function live(){
  if(!o)return;grab();
  var el=$('chk');
  if(el){var n=S.n,a=S.a;if(n===''){el.className='chk';el.textContent=''}else{var t=Number(n)+(a===''?0:Number(a));
    if(t===Number(o.seated)){el.className='chk good';el.textContent=n+' filled + '+(a||0)+' absent = '+t+'  (matches '+o.seated+' seated)'}
    else{el.className='chk bad';el.textContent=n+' filled + '+(a||0)+' absent = '+t+', but '+o.seated+' seated. Will be flagged.'}}}
  var e2=$('chk2');
  if(e2){if(S.m===''){e2.className='chk';e2.textContent=''}else if(Number(S.m)===Number(o.sheets)){e2.className='chk good';e2.textContent=S.m+' marked = '+o.sheets+' filled books returned'}
    else{e2.className='chk bad';e2.textContent=S.m+' marked, but '+o.sheets+' filled books were returned. Will be flagged.'}}
}
function countForm(btnText){
  return '<label for="f_n">Filled answer books returned (used, not blank)</label><input id="f_n" type="number" inputmode="numeric" min="0" value="'+esc(S.n)+'" oninput="live()">'
    +'<label for="f_a">Students absent</label><input id="f_a" type="number" inputmode="numeric" min="0" value="'+esc(S.a)+'" oninput="live()">'
    +'<div id="chk" class="chk"></div><button id="go" onclick="act(\'return\')">'+btnText+'</button>';
}
function stageBox(){
  var st=o.stage;
  if(st==='done')return '<div class="box big">&#10003; All done. Award list received and verified by the Exam Office.</div>';
  if(st==='verify'){
    var w='';
    if(Number(o.sheets)+(Number(o.absent)||0)!==Number(o.seated))w+='<div class="warn">Returned counts do not match: '+esc(o.sheets)+' filled + '+esc(o.absent)+' absent, but '+esc(o.seated)+' seated.</div>';
    if(o.markedBooks!==''&&o.markedBooks!=null&&Number(o.markedBooks)!==Number(o.sheets))w+='<div class="warn">Marked books ('+esc(o.markedBooks)+') do not match filled books returned ('+esc(o.sheets)+').</div>';
    return '<div class="box"><div class="hint" style="margin:0 0 6px">Exam Office only. The teacher has marked this envelope, but it is NOT final until the award list is received.</div>'+w
      +'<label for="f_st">Your employee code</label><input id="f_st" type="text" autocomplete="off" autocapitalize="off" value="'+esc(S.st)+'">'
      +'<label for="f_pin">Your PIN</label><input id="f_pin" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" value="'+esc(S.pin)+'">'
      +'<button id="go" onclick="act(\'verify\')">Award list RECEIVED: VERIFY</button></div>';
  }
  if(showFix&&(st==='return'||st==='mark'))return idBox(countForm(o.returned?'Update counts':'Mark RETURNED')+'<button class="lnk" onclick="showFix=false;render()">Back</button>');
  if(st==='receive')return idBox('<button id="go" onclick="act(\'receive\')">Mark RECEIVED</button><div class="hint">Tap when you take the envelope from the Exam Office.</div>');
  if(st==='return')return idBox(countForm('Mark RETURNED'));
  return idBox('<div class="hint" style="margin:0 0 4px">Filled books returned from the room: <b>'+esc(o.sheets)+'</b></div>'
    +'<label for="f_m">Answer books MARKED</label><input id="f_m" type="number" inputmode="numeric" min="0" value="'+esc(S.m)+'" oninput="live()">'
    +'<div id="chk2" class="chk"></div><button id="go" onclick="act(\'mark\')">Mark MARKED</button><button class="lnk" onclick="showFix=true;render()">Fix the returned counts</button>');
}
/* ---- screens ---- */
function homeScreen(){
  var s='<h1>Envelope Tracker</h1><div class="sub">Find an envelope without scanning its QR.</div><div id="m" class="msg '+kind+'">'+esc(msg)+'</div>';
  var f='<label for="f_q">Room, course code, title, envelope ID (or paste the link)</label><input id="f_q" type="text" autocomplete="off" value="'+esc(S.q)+'">'
    +'<label for="f_d">Exam date (optional)</label><input id="f_d" type="date" value="'+esc(S.d)+'"><button id="go" onclick="doSearch()">Search</button>';
  if(res){f+=res.map(function(r){return '<a class="res" href="?e='+encodeURIComponent(r.id)+'&k='+encodeURIComponent(r.k)+'&a='+encodeURIComponent(A)+'"><b>'+esc(r.title)+'</b><span>'+esc(r.code)+' &middot; '+esc(r.program)+' Sem '+esc(r.sem)+'</span><span>Room '+esc(r.room)+' &middot; '+esc(r.date)+' &middot; '+esc(r.slot)+'</span><span><b style="font-size:12px">'+esc(r.status)+'</b></span></a>'}).join('')}
  return s+idBox(f);
}
function doSearch(){
  grab();var q=S.q.trim(),m=/[?&]e=([^&\s#]+)/.exec(q);
  if(m){var k=/[?&]k=([^&\s#]+)/.exec(q);location.href='?e='+m[1]+(k?'&k='+k[1]:'')+'&a='+encodeURIComponent(A);return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;res=r;msg=r.length?'':'No envelope matched.';kind=r.length?'':'err';render()}).withFailureHandler(fail).envelopeSearch(emp,q,S.d);
}
function render(){
  grab();var Ap=$('app');
  if(!A){Ap.innerHTML='<div class="box"><h1>Link incomplete</h1><p class="sub">Open this page from the QR on the envelope, or from the home link given by the Exam Office (it ends with ?a=...).</p></div>';return}
  if(!ID){Ap.innerHTML=homeScreen();return}
  if(o&&o.denied){Ap.innerHTML='<div class="box"><h1>QR link not valid</h1><p class="sub">This link is missing its security key or is out of date. Ask the Exam Office to reprint the sticker, or <a href="?a='+esc(A)+'">search for the envelope</a>.</p></div>';return}
  if(!o)return;
  if(!o.found){Ap.innerHTML='<div class="box"><h1>Envelope not found</h1><div class="id">'+esc(ID)+'</div><p class="sub">This QR is not in the tracker. Ask the Exam Office to Sync again or reprint the tag.</p></div>';return}
  var st=o.stage,order=['receive','return','mark','verify'],labels=['Received','Returned','Marked','Verified'],idx=st==='done'?4:order.indexOf(st),s='';
  s+='<h1>'+esc(o.title)+'</h1><div class="sub">'+esc(o.code)+' &middot; '+esc(o.program)+' Sem '+esc(o.sem)+'</div><div class="id">'+esc(o.id)+'</div>';
  s+='<div class="steps">';for(var i=0;i<4;i++)s+='<div class="stp '+(i<idx?'done':i===idx?'now':'')+'">'+(i<idx?'&#10003; ':'')+labels[i]+'</div>';s+='</div>';
  s+='<div id="m" class="msg '+kind+'">'+esc(msg)+'</div>';
  s+='<div class="box">'+row('Room',o.room+(o.building?' ('+o.building+')':''))+row('Date',o.date)+row('Slot',o.slot)+row('Seated (this paper)',o.seated)+(o.inv?row('Invigilators',o.inv):'')
    +row('Received',o.received||'-')+row('Returned',o.returned||'-')+row('Filled books / Absent',(o.sheets===''?'-':o.sheets)+' / '+(o.absent===''?'-':o.absent))
    +row('Marked (teacher)',(o.marked||'-')+(o.markedBooks!==''&&o.markedBooks!=null?' | '+o.markedBooks+' books':''))+row('Verified (Exam Office)',o.verified||'-')+row('Status',o.status)+'</div>';
  s+=stageBox()+'<a class="lk" href="?a='+esc(A)+'">Search another envelope</a>';
  Ap.innerHTML=s;live();
}
function act(a){
  if(busy)return;grab();
  var p={emp:emp,filled:S.n,absent:S.a,marked:S.m,staff:S.st.trim(),pin:S.pin};
  function bad(x){return x===''||isNaN(Number(x))||Number(x)<0}
  if(a!=='verify'&&eState!=='found'){say('Enter your employee code and tap Continue first.','err');return}
  if(a==='return'&&bad(S.n)){say('Enter the number of FILLED answer books returned (0 or more).','err');return}
  if(a==='return'&&S.a!==''&&bad(S.a)){say('Students absent must be 0 or more.','err');return}
  if(a==='mark'&&bad(S.m)){say('Enter how many answer books were MARKED (0 or more).','err');return}
  if(a==='mark'&&Number(S.m)!==Number(o.sheets)&&!confirm('You entered '+S.m+' marked, but '+o.sheets+' filled books were returned. This will be flagged. Continue?'))return;
  if(a==='verify'&&(!p.staff||!p.pin.trim())){say('Enter your employee code and PIN.','err');return}
  if(a==='verify'&&!confirm('Verify this envelope? The award list has been received and this is final.'))return;
  setBusy(true);
  var tries=0;
  (function send(){
    google.script.run.withSuccessHandler(function(r){
      /* server busy: try again by itself (up to 4 times); the server ignores a step that was already saved */
      if(!r.ok&&/System busy/.test(r.msg||'')&&tries<4){tries++;var g=$('go');if(g)g.textContent='Server busy, retrying...';setTimeout(send,1500+tries*1000);return}
      busy=false;msg=r.msg;kind=r.ok?'ok':'err';if(a==='verify')S.pin='';
      if(r.info){setInfo(r.info);if(r.ok)showFix=false}
      render();window.scrollTo(0,0);
    }).withFailureHandler(function(e){
      if(tries<2&&/Could not reach|took too long/.test((e&&e.message)||'')){tries++;var g=$('go');if(g)g.textContent='Connection weak, retrying...';setTimeout(send,2000);return}
      fail(e);
    }).envelopeScanAction(ID,a,p,KEY);
  })();
}
if(emp&&A){google.script.run.withSuccessHandler(function(r){if(!eState){applyEmp(r);if(r.found||o||!ID)render()}}).withFailureHandler(function(){}).teacherLookup(emp,ID,KEY)}
if(ID&&A){google.script.run.withSuccessHandler(function(r){setInfo(r);render()}).withFailureHandler(function(e){$('app').innerHTML='<div class="box"><h1>Error</h1><p>'+esc(e.message)+'</p></div>'}).envelopeScanInfo(ID,KEY)}
else render();
</script></body></html>
