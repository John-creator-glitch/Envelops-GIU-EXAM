/* ===== look v10: polish only (no logic changes) ===== */
:root{--g:#0b4a37;--g1:#0f6a4e;--g2:#e6f3ec;--bg:#eef3f0;--ln:#dde6e1;--r:16px;--sh:0 1px 2px rgba(10,40,28,.05),0 6px 18px rgba(10,40,28,.07);--ac:#f2b705}

var Q=new URLSearchParams(location.search),API='https://script.google.com/macros/s/'+(Q.get('a')||DEFAULT_A)+'/exec';
(function(){
  /* read-only calls are retried once by themselves if the network drops (safe: they change nothing) */
  var READS={teacherLookup:1,envelopeScanInfo:1,envelopeSearch:1,envelopeDashboard:1,envelopeDeskList:1};
  function mk(ok,bad){return new Proxy({},{get:function(t,n){
    if(n==='withSuccessHandler')return function(f){return mk(f,bad)};
    if(n==='withFailureHandler')return function(f){return mk(ok,f)};
    return function(){var args=Array.prototype.slice.call(arguments);
      function go(att){
        var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},45000);
        fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:n,args:args}),credentials:'omit',redirect:'follow',signal:ctl.signal})
        .then(function(r){return r.json()})
        .then(function(j){clearTimeout(to);if(j&&j.ok){if(ok)ok(j.result)}else{var er=new Error((j&&j.error)||'The server did not accept the request.');er.final=true;throw er}})
        .catch(function(e){clearTimeout(to);
          var net=!e.final&&((e&&e.name==='AbortError')||(e&&e.message==='Failed to fetch'));
          if(net&&READS[n]&&att<1){setTimeout(function(){go(att+1)},700);return}
          var m=(e&&e.name==='AbortError')?'The server took too long. Check the internet and try again.':(e&&e.message==='Failed to fetch'?'Could not reach the server. Check the internet and try again.':(e&&e.message)||String(e));if(bad)bad({message:m});});
      }
      go(0);};}})}
  window.google={script:{run:mk(null,null)}};
})();

  if(a==='verify'&&(!p.staff||!p.pin.trim())){say('Enter your employee code and PIN.','err');return}
  if(a==='verify'&&!confirm('Verify this envelope? The award list has been received and this is final.'))return;
  setBusy(true);
  var tries=0;
  (function send(){
    google.script.run.withSuccessHandler(function(r){
      /* server busy: try again by itself (up to 4 times); the server ignores a step that was already saved */
      if(!r.ok&&/System busy/.test(r.msg||'')&&tries<4){tries++;var g=$('go');if(g)g.textContent='Server busy, retrying...';setTimeout(send,1500+tries*1000);return}
      busy=false;msg=r.msg;kind=r.ok?'ok':'err';if(a==='verify')S.pin='';
      if(r.ok&&!rem&&a!=='verify'){eState='';empName='';empNote='';emp='';S.emp=''}   /* next person types their own code */
      if(r.info){setInfo(r.info);if(r.ok)showFix=false}
      if(r.ok)SC={};   /* search lists are now out of date */
      render();window.scrollTo(0,0);
      if(r.ok)popup(POPT[a]||'Done',a==='return'?'NOT FINAL YET: give this envelope to the Exam Officer now and get the receiving confirmed.':(r.msg||''),a==='return',a==='return');
    }).withFailureHandler(function(e){
      if(tries<2&&/Could not reach|took too long/.test((e&&e.message)||'')){tries++;var g=$('go');if(g)g.textContent='Connection weak, retrying...';setTimeout(send,2000);return}
      fail(e);
    }).envelopeScanAction(ID,a,p,KEY);
  })();
}
/* ---- start ---- */
function restoreSearch(){try{var sv=JSON.parse(sessionStorage.getItem('envQ')||'null');if(sv){S.q=sv.q||'';S.d=sv.d||'';render();doSearch(true)}}catch(e2){}}
(function(){
  var ec=null;try{ec=JSON.parse(sessionStorage.getItem('envEmpI')||'null')}catch(e){}
  var known=!!(emp&&A&&!DM&&!DESK&&ec&&ec.emp===emp);
  if(emp&&A&&!DM&&!DESK){
    if(known){
      /* this tab already knows who you are: no waiting for the server */
      applyEmp({found:true,name:ec.name,source:ec.source});
      if(!ID){render();restoreSearch()}
    }else{
      google.script.run.withSuccessHandler(function(r){if(!eState){applyEmp(r);if(r.found||o||!ID)render();
        if(r.found&&!ID)restoreSearch()}}).withFailureHandler(function(){}).teacherLookup(emp,ID,KEY)}
  }
  if(ID&&A)loadInfo();
  else if(!known)render();
  if(!ID&&DESK)restoreDesk();
  if(!ID&&DM)restoreDash();
})();
