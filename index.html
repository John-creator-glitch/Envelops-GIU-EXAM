.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}.p-ok{background:#b7e1cd;color:#0b5d3b}.p-go{background:#cfe2f3;color:#1c4587}.p-at{background:#f4c7c3;color:#b3261e}.p-no{background:#eceff1;color:#546e7a}

<div class="c"><div id="app"><div class="sk" style="height:22px;width:55%;margin:18px 0 8px"></div><div class="sk" style="height:150px;margin:12px 0"></div><div class="sk" style="height:56px"></div></div></div>

<script>
/* Stand-in for google.script.run: each call goes to the Apps Script web app named in the link (?a=...) as plain text. */
/* Used only when the link has no ?a=... part, so the home link can be just the page address. Same ID as in Setup B6 (/macros/s/THIS PART/exec). */
var DEFAULT_A='AKfycbyrh9jmOp6Kw6EjuAKg8CLZv6d274zaMhXT-Hfzzpt76Mxt4z6ZJDjXN0nGGlaF40NM';
var Q=new URLSearchParams(location.search),API='https://script.google.com/macros/s/'+(Q.get('a')||DEFAULT_A)+'/exec';
(function(){
  /* read-only calls are retried once by themselves if the network drops (safe: they change nothing) */
  var READS={teacherLookup:1,envelopeScanInfo:1,envelopeSearch:1,envelopeDashboard:1};
  function mk(ok,bad){return new Proxy({},{get:function(t,n){
    if(n==='withSuccessHandler')return function(f){return mk(f,bad)};
    if(n==='withFailureHandler')return function(f){return mk(ok,f)};
    return function(){var args=Array.prototype.slice.call(arguments);
      function go(att){
        var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},45000);
        fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:n,args:args}),credentials:'omit',redirect:'follow',signal:ctl.signal})
        .then(function(r){return r.json()})
        .then(function(j){clearTimeout(to);if(j&&j.ok){if(ok)ok(j.result)}else{var er=new Error((j&&j.error)||'The server did not accept the request.');er.final=true;throw er}})
        .catch(function(e){clearTimeout(to);
          var net=!e.final&&((e&&e.name==='AbortError')||(e&&e.message==='Failed to fetch'));
          if(net&&READS[n]&&att<1){setTimeout(function(){go(att+1)},700);return}
          var m=(e&&e.name==='AbortError')?'The server took too long. Check the internet and try again.':(e&&e.message==='Failed to fetch'?'Could not reach the server. Check the internet and try again.':(e&&e.message)||String(e));if(bad)bad({message:m});});
      }
      go(0);};}})}
  window.google={script:{run:mk(null,null)}};
})();
</script>
<script>
if(Q.get('d')==='1'&&!Q.get('e'))document.body.className='dm';
var ID=Q.get('e')||'',KEY=Q.get('k')||'',A=Q.get('a')||DEFAULT_A;
var $=function(x){return document.getElementById(x)};
var note='',o=null,busy=false,showFix=false,showSeat=false,showUndo=false,dash=null,dashT=null,dsC='',dpP='',DM=(Q.get('d')==='1'),DESK=(Q.get('x')==='1'&&!Q.get('e')),msg='',kind='',res=null,filt='all',searched=false,stale=false;
var emp='',empName='',empNote='',eState='',eCan=false;
var S={emp:'',n:'',a:'0',m:'',tn:'',st:'',pin:'',q:'',d:'',sn:'',ss:'',sp:'',us:'',up:'',rs:'',rp:'',xs:'',xp:'',ms:'',mp:'',mq:'0',ds:'',dp:''};
/* FS = this envelope page was opened from the manual search. rem = the employee code is remembered in this browser tab (never the PIN). */
var FS=Q.get('s')==='1',rem=true;
try{localStorage.removeItem('envEmp');emp=sessionStorage.getItem('envEmp')||''}catch(e){}
S.emp=emp;
try{S.rs=sessionStorage.getItem('envRs')||''}catch(e){}
function today(){var d=new Date(),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
S.d='';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function row(a,b){return '<div class="row"><span>'+esc(a)+'</span><b>'+esc(b)+'</b></div>'}
function grab(){for(var k in S){var e=$('f_'+k);if(e)S[k]=e.value}}
function say(m,k){msg=m;kind=k||'';render();window.scrollTo(0,0)}
function fail(e){busy=false;say('Error: '+(e&&e.message?e.message:e),'err')}
function setBusy(b){busy=b;var bs=document.getElementsByTagName('button');for(var i=0;i<bs.length;i++)bs[i].disabled=b;var p=$('go');if(p&&b)p.textContent='Please wait...'}
function syncRes(r){if(r&&r.found&&r.status&&res)res.forEach(function(x){if(x.id===r.id)x.status=r.status})}
function setInfo(r){syncRes(r);o=r;S.n=(r.sheets===''||r.sheets==null)?'':String(r.sheets);S.a=(r.absent===''||r.absent==null)?'0':String(r.absent);S.m='';S.mq='0';if(r.req){S.n=String(r.req.filled);S.a=String(r.req.absent);S.mq=String(r.req.mcq||0)}
  try{if(r&&r.found&&ID)sessionStorage.setItem('envI:'+ID,JSON.stringify(r))}catch(e){}}
function skel(){return '<div class="sk" style="height:22px;width:60%;margin:18px 0 8px"></div><div class="sk" style="height:38px;margin:12px 0"></div><div class="sk" style="height:200px;margin:12px 0"></div><div class="sk" style="height:140px"></div>'}
function blocked(){if(stale){say('Updating this envelope, try again in a moment.','err');return true}return false}
/* run fn over ids with up to n at a time */
function pool(ids,n,fn,prog,end){var i=0,run=0,fin=0;
  function go(){while(run<n&&i<ids.length){(function(id){run++;fn(id,function(){run--;fin++;prog(fin);if(fin===ids.length)end();else go()})})(ids[i++])}}
  if(!ids.length)end();else go()}
/* ---- status groups (used for the colour bar and the filter buttons on the home page) ---- */
var GL={todo:'Not received',acc:'Awaiting Exam Office OK',room:'With invigilator',ret:'Returned',chk:'Checked',done:'Verified'};
function grp(s){s=String(s||'');
  if(s==='Verified')return 'done';
  if(s==='Awaiting verification'||/MISMATCH/.test(s))return 'chk';
  if(s==='Awaiting Exam Office OK')return 'room';
  if(s==='Returned OK'||s==='Returned: enter count'||s==='CHECK COUNT')return 'ret';
  if(s==='With invigilator')return 'room';return 'todo'}
function isBad(s){return s==='CHECK COUNT'||/MISMATCH/.test(String(s||''))}
/* ---- employee identity (one login, remembered on this phone tab) ---- */
function applyEmp(r){if(r.found){eState='found';empName=r.name;empNote=r.source==='Listed'?'':'Self-registered, not yet verified by the Exam Office';
    try{sessionStorage.setItem('envEmpI',JSON.stringify({emp:emp,name:r.name,source:r.source}))}catch(e){}}else{eState='new';eCan=r.canRegister===true}}
function eLookup(){
  grab();emp=S.emp.trim();try{sessionStorage.setItem('envEmp',emp)}catch(e){}
  if(!emp){say('Enter your employee code.','err');return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;msg='';kind='';applyEmp(r);render()}).withFailureHandler(fail).teacherLookup(emp,ID,KEY);
}
function eRegister(){
  grab();if(!S.tn.trim()){say('Enter your full name.','err');return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;if(r.ok){eState='found';empName=r.name;empNote=r.source==='Listed'?'':'Self-registered, not yet verified by the Exam Office';msg='';kind='';try{sessionStorage.setItem('envEmpI',JSON.stringify({emp:emp,name:r.name,source:r.source}))}catch(e){}}else{msg=r.msg;kind='err'}render()}).withFailureHandler(fail).teacherRegister(emp,S.tn.trim(),ID,KEY);
}
function eChange(){eState='';empName='';empNote='';emp='';S.emp='';res=null;searched=false;note='';sel={};try{sessionStorage.removeItem('envEmp');sessionStorage.removeItem('envEmpI')}catch(e){}render()}
function idBox(inner){
  var h='<div class="box">';
  if(eState==='found')h+=row('Employee',empName+' ('+emp+')')+(empNote?'<div class="hint">'+esc(empNote)+'</div>':'')+inner+'<button class="lnk" onclick="eChange()">Not you? Change employee code</button>';
  else if(eState==='new'&&!eCan)h+='<div class="hint" style="margin:0 0 6px">Employee code '+esc(emp)+' is not in the teachers list. '+(ID?'Please contact the Exam Office to have your code added.':'Scan any envelope QR once to register, or ask the Exam Office.')+'</div><button class="lnk" onclick="eChange()">Wrong code? Go back</button>';
  else if(eState==='new')h+='<div class="hint" style="margin:0 0 6px">Employee code '+esc(emp)+' is not in the teachers list. Register yourself once:</div><label for="f_tn">Your full name</label><input id="f_tn" type="text" style="font-size:16px" value="'+esc(S.tn)+'"><button id="go" onclick="eRegister()">Register and continue</button><button class="lnk" onclick="eChange()">Wrong code? Go back</button>';
  else h+='<label for="f_emp" style="margin-top:0">Your employee code</label><input id="f_emp" type="text" autocomplete="off" autocapitalize="off" value="'+esc(S.emp)+'"><button id="go" onclick="eLookup()">Continue</button>';
  return h+'</div>';
}
/* ---- live checks ---- */
function live(){
  if(!o)return;grab();
  var el=$('chk');
  if(el){var n=S.n,a=S.a;if(n===''){el.className='chk';el.textContent=''}else{var q=(S.mq===''||isNaN(Number(S.mq)))?0:Number(S.mq),t=Number(n)+(a===''?0:Number(a))+q,tx=n+' filled + '+(a||0)+' absent'+(q?' + '+q+' UMC':'');
    if(t===Number(o.seated)){el.className='chk good';el.textContent=tx+' = '+t+' (matches '+o.seated+' seated)'}
    else{el.className='chk bad';el.textContent=tx+' = '+t+', but '+o.seated+' seated. Will be flagged.'}}}
}
function countForm(btnText){
  return '<div class="two"><div><label for="f_n">Filled books returned</label><input id="f_n" type="number" inputmode="numeric" min="0" value="'+esc(S.n)+'" oninput="live()"></div>'
    +'<div><label for="f_a">Students absent</label><input id="f_a" type="number" inputmode="numeric" min="0" value="'+esc(S.a)+'" oninput="live()"></div></div>'
    +'<label for="f_mq">UMC cases (book not in envelope)</label><input id="f_mq" type="number" inputmode="numeric" min="0" value="'+esc(S.mq)+'" oninput="live()">'
    +'<div class="hint">Filled means used, not blank. If the book of a student was taken for an Unfair Means Case (UMC) and is not in this envelope, enter how many (else leave 0). Filled + absent + UMC = seated.</div><div id="chk" class="chk"></div><button id="go" onclick="act(\'return\')">'+btnText+'</button>';
}
function stageBox(){
  var st=o.stage;
  if(st==='done')return '<div class="box big">&#10003; All done. Award list received and verified by the Exam Office.</div>';
  if(st==='verify'){
    var w='';
    if(Number(o.sheets)+(Number(o.absent)||0)!==Number(o.seated))w+='<div class="warn">Returned counts do not match: '+esc(o.sheets)+' filled + '+esc(o.absent)+' absent, but '+esc(o.seated)+' seated.</div>';
    if(o.markedBooks!==''&&o.markedBooks!=null&&Number(o.markedBooks)!==Number(o.sheets))w+='<div class="warn">Checked books ('+esc(o.markedBooks)+') do not match filled books returned ('+esc(o.sheets)+').</div>';
    return '<div class="box"><div class="hint" style="margin:0 0 6px">Exam Office only. '+'The teacher has checked the papers, but '+'this envelope is NOT final until the award list is received.</div>'+w
      +'<label for="f_st">Your employee code</label><input id="f_st" type="text" autocomplete="off" autocapitalize="off" value="'+esc(S.st)+'">'
      +'<label for="f_pin">Your PIN</label><input id="f_pin" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" value="'+esc(S.pin)+'">'
      +'<button id="go" onclick="act(\'verify\')">Award list received: verify</button></div>';
  }
