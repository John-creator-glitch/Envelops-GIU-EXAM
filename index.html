<!-- Envelope Tracker scan page. Put this file, named index.html, on GitHub Pages. Nothing inside needs editing. -->
<!doctype html><html><head><meta charset="utf-8"><meta name="app" content="envelope-tracker-page"><title>Envelope Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f3f6f4;color:#1b2b24;-webkit-text-size-adjust:100%}
.c{max-width:480px;margin:0 auto;padding:12px 14px 40px}h1{font-size:19px;margin:6px 0 2px;line-height:1.25}.sub{font-size:13px;color:#4a5a52}.id{font-size:11px;color:#8a968f;word-break:break-all;margin-top:2px}
.steps{display:flex;gap:6px;margin:12px 0 8px}.stp{flex:1;text-align:center;font-size:11px;padding:8px 2px;border-radius:8px;background:#e3e8e5;color:#7a867f;font-weight:bold}
.stp.done{background:#0e3b2e;color:#fff}.stp.now{background:#fff;color:#0e3b2e;border:2px solid #0e3b2e}
.box{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #eee;font-size:14px}.row:last-child{border:0}.row b{text-align:right}
.msg{position:sticky;top:0;z-index:5;padding:12px;border-radius:10px;font-weight:bold;font-size:15px;margin:8px 0;display:none}
.msg.ok{display:block;background:#d9ead3;color:#0b3d1c}.msg.err{display:block;background:#f8d7d3;color:#7a1410}
button{width:100%;font-size:18px;padding:16px;margin:6px 0 0;border:0;border-radius:10px;background:#0e3b2e;color:#fff;font-weight:bold}button:disabled{background:#9aa8a1}
.lnk{background:none;color:#0e3b2e;font-size:14px;font-weight:normal;text-decoration:underline;padding:10px;margin-top:2px}
label{display:block;font-size:14px;margin:10px 0 4px;color:#35453d}input{width:100%;font-size:22px;padding:12px;border:1px solid #99a;border-radius:8px}
#who{font-size:16px;padding:10px}.chk{font-size:14px;font-weight:bold;margin:10px 0 2px;min-height:20px}.chk.good{color:#1b6b2f}.chk.bad{color:#b3261e}
.big{font-size:17px;text-align:center;padding:6px}.hint{font-size:12px;color:#7a867f;margin-top:6px}
</style></head><body><div class="c"><div id="app"><p style="padding:30px 0;text-align:center">Loading...</p></div></div>
<script>
/* Stand-in for google.script.run: each call goes to the Apps Script web app named in the link (?a=...) as plain text. No Google page is opened on the phone. */
var Q=new URLSearchParams(location.search),API='https://script.google.com/macros/s/'+(Q.get('a')||'')+'/exec';
(function(){
  function mk(ok,bad){return new Proxy({},{get:function(t,n){
    if(n==='withSuccessHandler')return function(f){return mk(f,bad)};
    if(n==='withFailureHandler')return function(f){return mk(ok,f)};
    return function(){var args=Array.prototype.slice.call(arguments);
      var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},45000);
      fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:n,args:args}),credentials:'omit',redirect:'follow',signal:ctl.signal})
      .then(function(r){return r.json()})
      .then(function(j){clearTimeout(to);if(j&&j.ok){if(ok)ok(j.result)}else{throw new Error((j&&j.error)||'The server did not accept the request.')}})
      .catch(function(e){clearTimeout(to);var m=(e&&e.name==='AbortError')?'The server took too long. Check the internet and try again.':(e&&e.message==='Failed to fetch'?'Could not reach the server. Check the internet and try again.':(e&&e.message)||String(e));if(bad)bad({message:m});});};}})}
  window.google={script:{run:mk(null,null)}};
})();
</script>
<script>
var ID=Q.get('e')||'';
var KEY=Q.get('k')||'';
var INIT=null;
var $=function(x){return document.getElementById(x)};
var o=INIT,busy=false,showFix=false,dn='',da='0',who='',emp='',tState='',tName='',tNote='',tCan=true,msg='',kind='';
try{who=localStorage.getItem('envWho')||'';emp=localStorage.getItem('envEmp')||''}catch(e){}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function row(a,b){return '<div class="row"><span>'+esc(a)+'</span><b>'+esc(b)+'</b></div>'}
function liveCheck(){
  var el=$('chk');if(!el||!o)return;var n=$('n').value,a=$('a').value;dn=n;da=a;
  if(n===''){el.className='chk';el.textContent='';return}
  var t=Number(n)+(a===''?0:Number(a));
  if(t===Number(o.seated)){el.className='chk good';el.textContent=n+' filled + '+(a||0)+' absent = '+t+'  (matches '+o.seated+' seated)'}
  else{el.className='chk bad';el.textContent=n+' filled + '+(a||0)+' absent = '+t+', but '+o.seated+' seated. Will be flagged.'}
}
function tSrc(x){return x==='Listed'?'':'Self-registered, not yet verified by the Exam Office'}
function tLookup(){
  var c=($('emp')?$('emp').value:'').trim();emp=c;try{localStorage.setItem('envEmp',emp)}catch(e){}
  if(!c){msg='Enter your employee code.';kind='err';render();return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;msg='';kind='';if(r.found){tState='found';tName=r.name;tNote=tSrc(r.source)}else{tState='new';tName='';tNote='';tCan=r.canRegister!==false}render()})
  .withFailureHandler(function(e){busy=false;msg='Error: '+(e&&e.message?e.message:e);kind='err';render()}).teacherLookup(c,ID,KEY);
}
function tRegister(){
  var nm=($('tn')?$('tn').value:'').trim();
  if(!nm){msg='Enter your full name.';kind='err';render();return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;if(r.ok){tState='found';tName=r.name;tNote=tSrc(r.source);msg='';kind=''}else{msg=r.msg;kind='err'}render()})
  .withFailureHandler(function(e){busy=false;msg='Error: '+(e&&e.message?e.message:e);kind='err';render()}).teacherRegister(emp,nm,ID,KEY);
}
function tChange(){tState='';tName='';tNote='';render()}
function teacherBox(){
  var h='<div class="box">';
  if(tState==='found'){h+=row('Teacher',tName+' ('+emp+')')+(tNote?'<div class="hint">'+esc(tNote)+'</div>':'')+'<button id="go" onclick="act(\'check\')">Mark CHECKED</button><button class="lnk" onclick="tChange()">Not you? Change employee code</button>'}
  else if(tState==='new'&&!tCan){h+='<div class="hint" style="margin:0 0 6px">Employee code '+esc(emp)+' is not in the teachers list. Please contact the Exam Office to have your code added.</div><button class="lnk" onclick="tChange()">Wrong code? Go back</button>'}
  else if(tState==='new'){h+='<div class="hint" style="margin:0 0 6px">Employee code '+esc(emp)+' is not in the teachers list. Register yourself once:</div><label for="tn">Your full name</label><input id="tn" type="text" style="font-size:16px;padding:10px"><button id="go" onclick="tRegister()">Register and continue</button><button class="lnk" onclick="tChange()">Wrong code? Go back</button>'}
  else{h+='<label for="emp">Teacher employee code (required)</label><input id="emp" type="text" autocomplete="off" autocapitalize="off" value="'+esc(emp)+'" oninput="saveEmp()" style="font-size:18px;padding:10px"><button id="go" onclick="tLookup()">Continue</button>'}
  return h;
}
function saveEmp(){emp=$('emp').value;try{localStorage.setItem('envEmp',emp)}catch(e){}}
function saveWho(){who=$('who').value;try{localStorage.setItem('envWho',who)}catch(e){}}
function setBusy(b){busy=b;var bs=document.getElementsByTagName('button');for(var i=0;i<bs.length;i++){bs[i].disabled=b}var p=$('go');if(p&&b)p.textContent='Saving...'}
function render(){
  var A=$('app');
  if(o&&o.denied){A.innerHTML='<div class="box"><h1>QR link not valid</h1><p class="sub">This link is missing its security key or is out of date. Ask the Exam Office to reprint the sticker.</p></div>';return}
  if(!o||!o.found){A.innerHTML='<div class="box"><h1>Envelope not found</h1><div class="id">'+esc(ID)+'</div><p class="sub">This QR is not in the tracker. Run Envelopes > Sync again, or reprint the tag.</p></div>';return}
  var st=o.stage,s='';
  var order=['dispatch','return','check','approve'],labels=['Dispatched','Returned','Checked','Approved'],idx=st==='done'?4:order.indexOf(st);
  s+='<h1>'+esc(o.title)+'</h1><div class="sub">'+esc(o.code)+' &middot; '+esc(o.program)+' Sem '+esc(o.sem)+'</div><div class="id">'+esc(o.id)+'</div>';
  s+='<div class="steps">';for(var i=0;i<4;i++){s+='<div class="stp '+(i<idx?'done':i===idx?'now':'')+'">'+(i<idx?'&#10003; ':'')+labels[i]+'</div>'}s+='</div>';
  s+='<div id="m" class="msg '+kind+'">'+esc(msg)+'</div>';
  s+='<div class="box">'+row('Room',o.room+(o.building?' ('+o.building+')':''))+row('Date',o.date)+row('Slot',o.slot)+row('Seated (this paper)',o.seated)+(o.inv?row('Invigilators',o.inv):'')
    +row('Dispatched',o.dispatched||'-')+row('Returned',o.returned||'-')+row('Filled books / Absent',(o.sheets===''?'-':o.sheets)+' / '+(o.absent===''?'-':o.absent))+row('Checked (teacher)',o.checked||'-')+(o.empCode?row('Teacher employee code',o.empCode):'')+row('Award list received (Exam Office)',o.award||'-')+'</div>';
  if(st==='done'){s+='<div class="box big">&#10003; All done. Award list received and approved by the Exam Office.</div>'}
  else{
    if(!(st==='check'&&!showFix))s+='<div class="box"><label for="who">Your name (required, saved on this phone)</label><input id="who" type="text" value="'+esc(who)+'" placeholder="e.g. Ali" oninput="saveWho()" style="font-size:16px;padding:10px"></div>';
    if(st==='dispatch'&&!showFix){
      s+='<div class="box"><button id="go" onclick="act(\'dispatch\')">Mark DISPATCHED</button><div class="hint">Tap when the envelope leaves for the room.</div>'
        +'<button class="lnk" onclick="showFix=true;render()">Already in room? Record the return instead</button></div>';
    }else if(st==='approve'){
      s+='<div class="box"><div class="hint" style="margin:0 0 6px">The teacher has checked this envelope, but it is NOT final until the Exam Office has received the award list.</div>'
        +'<label for="pin">Exam Office PIN</label><input id="pin" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" style="font-size:18px;padding:10px">'
        +'<button id="go" onclick="act(\'approve\')">Award list RECEIVED: APPROVE</button></div>';
    }else if(st==='check'&&!showFix){
      s+=teacherBox()
        +'<button class="lnk" onclick="showFix=true;render()">Fix the counts</button></div>';
    }else{
      if(dn===''&&o.sheets!=='')dn=String(o.sheets);if(o.absent!==''&&da==='0')da=String(o.absent);
      s+='<div class="box"><label for="n">Filled answer books returned (used, not blank)</label><input id="n" type="number" inputmode="numeric" min="0" value="'+esc(dn)+'" oninput="liveCheck()">'
        +'<label for="a">Students absent</label><input id="a" type="number" inputmode="numeric" min="0" value="'+esc(da)+'" oninput="liveCheck()">'
        +'<div id="chk" class="chk"></div><button id="go" onclick="act(\'return\')">'+(o.returned?'Update counts':'Mark RETURNED')+'</button>'
        +(showFix?'<button class="lnk" onclick="showFix=false;render()">Back</button>':'')+'</div>';
    }
  }
  A.innerHTML=s;liveCheck();
}
function act(a){
  if(busy)return;
  if(a!=='check'&&!String(who).replace(/ /g,'')){msg='Please enter your name first.';kind='err';render();window.scrollTo(0,0);if($('who'))$('who').focus();return}
  var n=$('n')?$('n').value:'',ab=$('a')?$('a').value:'',pin=$('pin')?$('pin').value:'',ec=emp;
  if(a==='return'&&(n===''||isNaN(Number(n))||Number(n)<0)){msg='Enter the number of FILLED answer books returned (0 or more).';kind='err';render();window.scrollTo(0,0);if($('n'))$('n').focus();return}
  if(a==='approve'&&!String(pin).replace(/ /g,'')){msg='Enter the Exam Office PIN.';kind='err';render();window.scrollTo(0,0);if($('pin'))$('pin').focus();return}
  if(a==='check'&&tState!=='found'){msg='Enter your employee code and tap Continue first.';kind='err';render();window.scrollTo(0,0);return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){
    busy=false;msg=r.msg;kind=r.ok?'ok':'err';if(r.info){o=r.info;if(r.ok){showFix=false}}
    render();window.scrollTo(0,0);
  }).withFailureHandler(function(e){busy=false;msg='Error: '+(e&&e.message?e.message:e);kind='err';render();window.scrollTo(0,0)}).envelopeScanAction(ID,a,n,ab,who,pin,ec,KEY);
}
if(o){render()}else{google.script.run.withSuccessHandler(function(r){o=r;render()}).withFailureHandler(function(e){$('app').innerHTML='<div class="box"><h1>Error</h1><p>'+esc(e.message)+'</p></div>'}).envelopeScanInfo(ID,KEY)}
</script></body></html>
