<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="app" content="envelope-tracker-page"><title>Envelope Tracker</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--g:#0e3b2e;--g2:#e8f1ec;--bg:#f2f5f3;--tx:#1b2b24;--mu:#5d6d65;--ln:#d9e1dc}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
.top{background:var(--g);color:#fff;padding:14px 16px 12px}.top h1{font-size:19px;margin:0;line-height:1.2}.top .s{font-size:13px;opacity:.8;margin-top:2px}
.c{max-width:520px;margin:0 auto;padding:0 14px 48px}
h2{font-size:18px;margin:14px 0 2px;line-height:1.25}.sub{font-size:13px;color:var(--mu)}.id{font-size:11px;color:#8a968f;word-break:break-all;margin-top:2px}
.box{background:#fff;border-radius:12px;padding:14px;margin:12px 0;border:1px solid var(--ln)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #eef1ef;font-size:14px}.row:last-child{border:0}.row span{color:var(--mu)}.row b{text-align:right}
.msg{position:sticky;top:0;z-index:5;padding:12px;border-radius:10px;font-weight:600;font-size:15px;margin:10px 0;display:none}
.msg.ok{display:block;background:#d9ead3;color:#0b3d1c}.msg.err{display:block;background:#f8d7d3;color:#7a1410}
button{width:100%;font:inherit;font-size:17px;padding:15px;margin:8px 0 0;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
button:disabled{background:#9aa8a1}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.lnk{background:none;color:var(--g);font-size:14px;font-weight:400;text-decoration:underline;padding:10px;margin-top:2px}
a.lk{display:block;text-align:center;color:var(--g);font-size:14px;padding:14px;text-decoration:underline}
label{display:block;font-size:14px;margin:12px 0 4px;color:#35453d}
input{width:100%;font:inherit;font-size:18px;padding:11px;border:1px solid #9aa8a1;border-radius:8px;background:#fff}
.chk{font-size:14px;font-weight:600;margin:10px 0 2px;min-height:20px}.chk.good{color:#1b6b2f}.chk.bad{color:#b3261e}
.big{font-size:17px;text-align:center;padding:6px}.hint{font-size:12px;color:var(--mu);margin-top:6px}.warn{font-size:13px;color:#7a1410;background:#f8d7d3;border-radius:8px;padding:8px;margin:6px 0}
.steps{display:flex;gap:6px;margin:14px 0 6px}.stp{flex:1;text-align:center;font-size:12px;padding:9px 2px;border-radius:8px;background:#e3e8e5;color:#7a867f;font-weight:600}
.stp.done{background:var(--g);color:#fff}.stp.now{background:#fff;color:var(--g);border:2px solid var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;margin:6px 0 0;-webkit-overflow-scrolling:touch}
.chip{flex:none;width:auto;font-size:13px;padding:8px 12px;margin:0;border-radius:99px;background:#fff;color:var(--tx);border:1px solid var(--ln);font-weight:500}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
a.res{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--ln);border-left:6px solid #9aa8a1;border-radius:10px;padding:10px 12px;margin:8px 0}
a.res b{display:block;font-size:15px;line-height:1.3}a.res span{font-size:12.5px;color:var(--mu);display:block;margin-top:2px}
a.res i{display:inline-block;font-style:normal;font-size:12px;font-weight:700;margin-top:6px;padding:3px 9px;border-radius:99px;background:#eceff1;color:#546e7a}
.g-todo{border-left-color:#9aa8a1}.g-room{border-left-color:#e0a800}.g-ret{border-left-color:#3d9a54}.g-chk{border-left-color:#3b78c4}.g-done{border-left-color:#0b5d3b}.g-bad{border-left-color:#b3261e}
.g-room i{background:#fff2cc;color:#7a5b00}.g-ret i{background:#d9ead3;color:#1b5e20}.g-chk i{background:#cfe2f3;color:#1c4587}.g-done i{background:#b7e1cd;color:#0b5d3b}.g-bad i{background:#f4c7c3;color:#b3261e}
.empty{text-align:center;color:var(--mu);font-size:14px;padding:22px 8px}
</style></head><body>
<div class="top"><h1>Envelope Tracker</h1><div class="s">Exam Office</div></div>
<div class="c"><div id="app"><p style="padding:30px 0;text-align:center">Loading...</p></div></div>
<script>
/* Stand-in for google.script.run: each call goes to the Apps Script web app named in the link (?a=...) as plain text. */
/* Used only when the link has no ?a=... part, so the home link can be just the page address. Same ID as in Setup B6 (/macros/s/THIS PART/exec). */
var DEFAULT_A='AKfycbyrh9jmOp6Kw6EjuAKg8CLZv6d274zaMhXT-Hfzzpt76Mxt4z6ZJDjXN0nGGlaF40NM';
var Q=new URLSearchParams(location.search),API='https://script.google.com/macros/s/'+(Q.get('a')||DEFAULT_A)+'/exec';
(function(){
  function mk(ok,bad){return new Proxy({},{get:function(t,n){
    if(n==='withSuccessHandler')return function(f){return mk(f,bad)};
    if(n==='withFailureHandler')return function(f){return mk(ok,f)};
    return function(){var args=Array.prototype.slice.call(arguments);
      var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},45000);
      fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:n,args:args}),credentials:'omit',redirect:'follow',signal:ctl.signal})
      .then(function(r){return r.json()})
      .then(function(j){clearTimeout(to);if(j&&j.ok){if(ok)ok(j.result)}else{throw new Error((j&&j.error)||'The server did not accept the request.')}})
      .catch(function(e){clearTimeout(to);var m=(e&&e.name==='AbortError')?'The server took too long. Check the internet and try again.':(e&&e.message==='Failed to fetch'?'Could not reach the server. Check the internet and try again.':(e&&e.message)||String(e));if(bad)bad({message:m});});};}})}
  window.google={script:{run:mk(null,null)}};
})();
</script>
<script>
var ID=Q.get('e')||'',KEY=Q.get('k')||'',A=Q.get('a')||DEFAULT_A;
var $=function(x){return document.getElementById(x)};
var note='',o=null,busy=false,showFix=false,msg='',kind='',res=null,filt='all',searched=false;
var emp='',empName='',empNote='',eState='',eCan=false;
var S={emp:'',n:'',a:'0',m:'',tn:'',st:'',pin:'',q:'',d:''};
try{emp=localStorage.getItem('envEmp')||''}catch(e){}
S.emp=emp;
function today(){var d=new Date(),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
S.d='';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function row(a,b){return '<div class="row"><span>'+esc(a)+'</span><b>'+esc(b)+'</b></div>'}
function grab(){for(var k in S){var e=$('f_'+k);if(e)S[k]=e.value}}
function say(m,k){msg=m;kind=k||'';render();window.scrollTo(0,0)}
function fail(e){busy=false;say('Error: '+(e&&e.message?e.message:e),'err')}
function setBusy(b){busy=b;var bs=document.getElementsByTagName('button');for(var i=0;i<bs.length;i++)bs[i].disabled=b;var p=$('go');if(p&&b)p.textContent='Please wait...'}
function setInfo(r){o=r;S.n=(r.sheets===''||r.sheets==null)?'':String(r.sheets);S.a=(r.absent===''||r.absent==null)?'0':String(r.absent);S.m=''}
/* ---- status groups (used for the colour bar and the filter buttons on the home page) ---- */
var GL={todo:'Not received',room:'With invigilator',ret:'Returned',chk:'Checked',done:'Verified'};
function grp(s){s=String(s||'');
  if(s==='Verified')return 'done';
  if(s==='Awaiting verification'||/MISMATCH/.test(s))return 'chk';
  if(s==='Returned OK'||s==='Returned: enter count'||s==='CHECK COUNT')return 'ret';
  if(s==='With invigilator')return 'room';return 'todo'}
function isBad(s){return s==='CHECK COUNT'||/MISMATCH/.test(String(s||''))}
/* ---- employee identity (one login, remembered on this phone) ---- */
function applyEmp(r){if(r.found){eState='found';empName=r.name;empNote=r.source==='Listed'?'':'Self-registered, not yet verified by the Exam Office'}else{eState='new';eCan=r.canRegister===true}}
function eLookup(){
  grab();emp=S.emp.trim();try{localStorage.setItem('envEmp',emp)}catch(e){}
  if(!emp){say('Enter your employee code.','err');return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;msg='';kind='';applyEmp(r);render()}).withFailureHandler(fail).teacherLookup(emp,ID,KEY);
}
function eRegister(){
  grab();if(!S.tn.trim()){say('Enter your full name.','err');return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;if(r.ok){eState='found';empName=r.name;empNote=r.source==='Listed'?'':'Self-registered, not yet verified by the Exam Office';msg='';kind=''}else{msg=r.msg;kind='err'}render()}).withFailureHandler(fail).teacherRegister(emp,S.tn.trim(),ID,KEY);
}
function eChange(){eState='';empName='';empNote='';res=null;searched=false;render()}
function idBox(inner){
  var h='<div class="box">';
  if(eState==='found')h+=row('Employee',empName+' ('+emp+')')+(empNote?'<div class="hint">'+esc(empNote)+'</div>':'')+inner+'<button class="lnk" onclick="eChange()">Not you? Change employee code</button>';
  else if(eState==='new'&&!eCan)h+='<div class="hint" style="margin:0 0 6px">Employee code '+esc(emp)+' is not in the teachers list. '+(ID?'Please contact the Exam Office to have your code added.':'Scan any envelope QR once to register, or ask the Exam Office.')+'</div><button class="lnk" onclick="eChange()">Wrong code? Go back</button>';
  else if(eState==='new')h+='<div class="hint" style="margin:0 0 6px">Employee code '+esc(emp)+' is not in the teachers list. Register yourself once:</div><label for="f_tn">Your full name</label><input id="f_tn" type="text" style="font-size:16px" value="'+esc(S.tn)+'"><button id="go" onclick="eRegister()">Register and continue</button><button class="lnk" onclick="eChange()">Wrong code? Go back</button>';
  else h+='<label for="f_emp" style="margin-top:0">Your employee code</label><input id="f_emp" type="text" autocomplete="off" autocapitalize="off" value="'+esc(S.emp)+'"><button id="go" onclick="eLookup()">Continue</button>';
  return h+'</div>';
}
/* ---- live checks ---- */
function live(){
  if(!o)return;grab();
  var el=$('chk');
  if(el){var n=S.n,a=S.a;if(n===''){el.className='chk';el.textContent=''}else{var t=Number(n)+(a===''?0:Number(a));
    if(t===Number(o.seated)){el.className='chk good';el.textContent=n+' filled + '+(a||0)+' absent = '+t+' (matches '+o.seated+' seated)'}
    else{el.className='chk bad';el.textContent=n+' filled + '+(a||0)+' absent = '+t+', but '+o.seated+' seated. Will be flagged.'}}}
  var e2=$('chk2');
  if(e2){if(S.m===''){e2.className='chk';e2.textContent=''}else if(Number(S.m)===Number(o.sheets)){e2.className='chk good';e2.textContent=S.m+' checked = '+o.sheets+' filled books returned'}
    else{e2.className='chk bad';e2.textContent=S.m+' checked, but '+o.sheets+' filled books were returned. Will be flagged.'}}
}
function countForm(btnText){
  return '<div class="two"><div><label for="f_n">Filled books returned</label><input id="f_n" type="number" inputmode="numeric" min="0" value="'+esc(S.n)+'" oninput="live()"></div>'
    +'<div><label for="f_a">Students absent</label><input id="f_a" type="number" inputmode="numeric" min="0" value="'+esc(S.a)+'" oninput="live()"></div></div>'
    +'<div class="hint">Filled means used, not blank.</div><div id="chk" class="chk"></div><button id="go" onclick="act(\'return\')">'+btnText+'</button>';
}
function stageBox(){
  var st=o.stage;
  if(st==='done')return '<div class="box big">&#10003; All done. Award list received and verified by the Exam Office.</div>';
  if(st==='verify'){
    var w='';
    if(Number(o.sheets)+(Number(o.absent)||0)!==Number(o.seated))w+='<div class="warn">Returned counts do not match: '+esc(o.sheets)+' filled + '+esc(o.absent)+' absent, but '+esc(o.seated)+' seated.</div>';
    if(o.markedBooks!==''&&o.markedBooks!=null&&Number(o.markedBooks)!==Number(o.sheets))w+='<div class="warn">Checked books ('+esc(o.markedBooks)+') do not match filled books returned ('+esc(o.sheets)+').</div>';
    return '<div class="box"><div class="hint" style="margin:0 0 6px">Exam Office only. The teacher has checked the papers, but this envelope is NOT final until the award list is received.</div>'+w
      +'<label for="f_st">Your employee code</label><input id="f_st" type="text" autocomplete="off" autocapitalize="off" value="'+esc(S.st)+'">'
      +'<label for="f_pin">Your PIN</label><input id="f_pin" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" value="'+esc(S.pin)+'">'
      +'<button id="go" onclick="act(\'verify\')">Award list received: verify</button></div>';
  }
  if(showFix&&(st==='return'||st==='mark'))return idBox(countForm(o.returned?'Update counts':'Mark returned')+'<button class="lnk" onclick="showFix=false;render()">Back</button>');
  if(st==='receive')return idBox('<button id="go" onclick="act(\'receive\')">Mark received</button><div class="hint">Tap when you take the envelope from the Exam Office.</div>');
  if(st==='return')return idBox(countForm('Mark returned'));
  return idBox('<div class="hint" style="margin:0 0 4px">Filled books returned from the room: <b>'+esc(o.sheets)+'</b></div>'
    +'<label for="f_m">Answer books CHECKED by the teacher</label><input id="f_m" type="number" inputmode="numeric" min="0" value="'+esc(S.m)+'" oninput="live()">'
    +'<div id="chk2" class="chk"></div><button id="go" onclick="act(\'mark\')">Mark papers checked</button><button class="lnk" onclick="showFix=true;render()">Fix the returned counts</button>');
}
/* ---- home page: find an envelope without its QR ---- */
function cardHtml(r){
  var g=isBad(r.status)?'bad':grp(r.status);
  return '<a class="res g-'+g+'" href="?e='+encodeURIComponent(r.id)+'&k='+encodeURIComponent(r.k)+'&a='+encodeURIComponent(A)+'"><b>'+esc(r.title)+'</b>'
    +'<span>'+esc(r.code)+', '+esc(r.program)+' Sem '+esc(r.sem)+'</span><span>Room '+esc(r.room)+', '+esc(r.date)+', '+esc(r.slot)+'</span><i>'+esc(r.status)+'</i></a>';
}
function resultsHtml(){
  if(!searched)return '';
  if(!res||!res.length)return '<div class="empty">No envelope matched'+(S.d?' on this date. Tap "Any date" to search all dates.':'. Try fewer words.')+'</div>';
  var cnt={all:res.length,todo:0,room:0,ret:0,chk:0,done:0};
  res.forEach(function(r){cnt[grp(r.status)]++});
  var h=note?'<div class="hint">'+esc(note)+'</div>':'';h+='<div class="chips">',keys=['all','todo','room','ret','chk','done'];
  keys.forEach(function(k){if(k!=='all'&&!cnt[k])return;h+='<button class="chip'+(filt===k?' on':'')+'" onclick="setFilt(\''+k+'\')">'+(k==='all'?'All':GL[k])+' '+cnt[k]+'</button>'});
  h+='</div>';
  var list=res.filter(function(r){return filt==='all'||grp(r.status)===filt});
  h+=list.map(cardHtml).join('');
  if(res.length>=30)h+='<div class="hint">Showing the first 30. Add a word or a date to narrow the list.</div>';
  return h;
}
function setFilt(k){grab();filt=k;render()}
function homeScreen(){
  var s='<h2>Find an envelope</h2><div class="sub">No QR needed. Search by room, course code, course title, teacher or invigilator name.</div><div id="m" class="msg '+kind+'">'+esc(msg)+'</div>';
  var f='<label for="f_q">Search</label><input id="f_q" type="search" autocomplete="off" placeholder="Room, course code, title, name" value="'+esc(S.q)+'">'
    +'<label for="f_d">Exam date (optional)</label><input id="f_d" type="date" value="'+esc(S.d)+'">'
    +'<button id="go" onclick="doSearch()">Search</button>'
    +'<div class="two"><button class="lnk" onclick="quick(today())">Today\'s envelopes</button><button class="lnk" onclick="quick(\'\')">Any date</button></div>';
  return s+idBox(f)+(eState==='found'?resultsHtml():'');
}
function quick(d){var q=$('f_q'),e=$('f_d');if(q)q.value='';if(e)e.value=d;doSearch()}
function doSearch(auto){
  if(!auto)grab();var q=S.q.trim(),m=/[?&]e=([^&\s#]+)/.exec(q);
  if(m){var k=/[?&]k=([^&\s#]+)/.exec(q);location.href='?e='+m[1]+(k?'&k='+k[1]:'')+'&a='+encodeURIComponent(A);return}
  setBusy(true);
  google.script.run.withSuccessHandler(function(r){busy=false;res=r;searched=true;filt='all';msg='';kind='';note=(!q&&!S.d&&r.length)?'Showing the next exam date: '+r[0].date+'. Type a word or pick a date to search elsewhere.':'';render()}).withFailureHandler(fail).envelopeSearch(emp,q,S.d);
}
/* ---- envelope screen ---- */
function render(){
  grab();var Ap=$('app');
  if(!A){Ap.innerHTML='<div class="box"><h2>Link incomplete</h2><p class="sub">Open this page from the QR on the envelope, or from the home link given by the Exam Office (it ends with ?a=...).</p></div>';return}
  if(!ID){Ap.innerHTML=homeScreen();return}
  if(o&&o.denied){Ap.innerHTML='<div class="box"><h2>QR link not valid</h2><p class="sub">This link is missing its security key or is out of date. Ask the Exam Office to reprint the sticker, or <a href="?a='+esc(A)+'">search for the envelope</a>.</p></div>';return}
  if(!o)return;
  if(!o.found){Ap.innerHTML='<div class="box"><h2>Envelope not found</h2><div class="id">'+esc(ID)+'</div><p class="sub">This QR is not in the tracker. Ask the Exam Office to Sync again or reprint the tag. Or <a href="?a='+esc(A)+'">search for the envelope</a>.</p></div>';return}
  var st=o.stage,order=['receive','return','mark','verify'],labels=['Received','Returned','Checked','Verified'],idx=st==='done'?4:order.indexOf(st),s='';
  s+='<a class="lk" style="text-align:left;padding:12px 0 0" href="?a='+esc(A)+'">Back to search</a>';
  s+='<h2 style="margin-top:4px">'+esc(o.title)+'</h2><div class="sub">'+esc(o.code)+', '+esc(o.program)+' Sem '+esc(o.sem)+'</div><div class="id">'+esc(o.id)+'</div>';
  s+='<div class="steps">';for(var i=0;i<4;i++)s+='<div class="stp '+(i<idx?'done':i===idx?'now':'')+'">'+(i<idx?'&#10003; ':'')+labels[i]+'</div>';s+='</div>';
  s+='<div id="m" class="msg '+kind+'">'+esc(msg)+'</div>';
  s+='<div class="box">'+row('Room',o.room+(o.building?' ('+o.building+')':''))+row('Date',o.date)+row('Slot',o.slot)+row('Seated (this paper)',o.seated)+(o.inv?row('Invigilators',o.inv):'')
    +row('Received',o.received||'-')+row('Returned',o.returned||'-')+row('Filled books / Absent',(o.sheets===''?'-':o.sheets)+' / '+(o.absent===''?'-':o.absent))
    +row('Checked (teacher)',(o.marked||'-')+(o.markedBooks!==''&&o.markedBooks!=null?' | '+o.markedBooks+' books':''))+row('Verified (Exam Office)',o.verified||'-')+row('Status',o.status)+'</div>';
  s+=stageBox()+'<a class="lk" href="?a='+esc(A)+'">Search another envelope</a>';
  Ap.innerHTML=s;live();
}
function act(a){
  if(busy)return;grab();
  var p={emp:emp,filled:S.n,absent:S.a,marked:S.m,staff:S.st.trim(),pin:S.pin};
  function bad(x){return x===''||isNaN(Number(x))||Number(x)<0}
  if(a!=='verify'&&eState!=='found'){say('Enter your employee code and tap Continue first.','err');return}
  if(a==='return'&&bad(S.n)){say('Enter the number of FILLED answer books returned (0 or more).','err');return}
  if(a==='return'&&S.a!==''&&bad(S.a)){say('Students absent must be 0 or more.','err');return}
  if(a==='mark'&&bad(S.m)){say('Enter how many answer books were CHECKED (0 or more).','err');return}
  if(a==='mark'&&Number(S.m)!==Number(o.sheets)&&!confirm('You entered '+S.m+' checked, but '+o.sheets+' filled books were returned. This will be flagged. Continue?'))return;
  if(a==='verify'&&(!p.staff||!p.pin.trim())){say('Enter your employee code and PIN.','err');return}
  if(a==='verify'&&!confirm('Verify this envelope? The award list has been received and this is final.'))return;
  setBusy(true);
  var tries=0;
  (function send(){
    google.script.run.withSuccessHandler(function(r){
      /* server busy: try again by itself (up to 4 times); the server ignores a step that was already saved */
      if(!r.ok&&/System busy/.test(r.msg||'')&&tries<4){tries++;var g=$('go');if(g)g.textContent='Server busy, retrying...';setTimeout(send,1500+tries*1000);return}
      busy=false;msg=r.msg;kind=r.ok?'ok':'err';if(a==='verify')S.pin='';
      if(r.info){setInfo(r.info);if(r.ok)showFix=false}
      render();window.scrollTo(0,0);
    }).withFailureHandler(function(e){
      if(tries<2&&/Could not reach|took too long/.test((e&&e.message)||'')){tries++;var g=$('go');if(g)g.textContent='Connection weak, retrying...';setTimeout(send,2000);return}
      fail(e);
    }).envelopeScanAction(ID,a,p,KEY);
  })();
}
/* ---- start ---- */
if(emp&&A){google.script.run.withSuccessHandler(function(r){if(!eState){applyEmp(r);if(r.found||o||!ID)render()}}).withFailureHandler(function(){}).teacherLookup(emp,ID,KEY)}
if(ID&&A){google.script.run.withSuccessHandler(function(r){setInfo(r);render()}).withFailureHandler(function(e){$('app').innerHTML='<div class="box"><h2>Error</h2><p>'+esc(e.message)+'</p></div>'}).envelopeScanInfo(ID,KEY)}
else render();
</script></body></html>
