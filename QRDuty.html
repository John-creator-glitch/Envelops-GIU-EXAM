<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00391B">
<link rel="icon" href="data:,">
<title>Invigilator Duties</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500..700&display=swap" rel="stylesheet">
<style>
:root{
  --g9:#00391B; --g7:#005C2C; --gold:#F2A31B; --gold-soft:#FFD27A;
  --bg:#F4F7F5; --surface:#FCFEFD; --ink:#10261A; --ink2:#3F5448; --mut:#64776B;
  --line:#E1E9E4; --line2:#CBD8D0; --chip:#EAF1ED;
  --font:'Manrope','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
button,input{font:inherit}
.wrap{width:100%;max-width:880px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}

.hero{background:linear-gradient(135deg,var(--g9),var(--g7));color:#fff;padding:22px 0 30px;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.22)}
.crest{width:54px;height:54px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain;padding:5px}
.crest.ini{color:var(--g7);font-weight:900;font-size:17px;border:3px solid var(--gold)}
.brand b{display:block;font-size:14px;font-weight:700}
.brand span{display:block;font-size:13px;color:var(--gold-soft);font-weight:600}
h1{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:clamp(30px,6vw,42px);line-height:1.1;letter-spacing:-.015em}
.sub{color:#E1ECE6;font-size:15px}

.find{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 0}
.find form{display:flex;gap:10px}
.find input{flex:1;min-width:0;height:52px;border:1px solid var(--line2);border-radius:8px;padding:0 16px;background:#fff;color:var(--ink);font-size:16px;outline:none}
.find input:focus{border-color:var(--g7);box-shadow:0 0 0 3px rgba(0,92,44,.14)}
.find button{height:52px;padding:0 24px;border:0;border-radius:8px;background:var(--g7);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.find button:disabled{opacity:.55;cursor:wait}
.hint{margin:8px 0 0;font-size:14px;color:var(--ink2)}

main{padding:26px 0 8px;min-height:40vh}
.note{padding:16px 18px;border-radius:10px;background:var(--chip);color:var(--ink);font-weight:600;font-size:15px}
.note.bad{background:#FBE9E7;color:#8A2A1C}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pick button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;min-height:56px;padding:10px 16px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--ink)}
.pick button:hover{border-color:var(--g7);background:var(--chip)}
.pick b{display:block;font-weight:800}
.pick small{display:block;color:var(--ink2);font-size:13px}
.pick em{font-style:normal;font-size:13px;font-weight:700;color:var(--g7);white-space:nowrap}

.who{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.who h2{margin:0;font-family:var(--serif);font-size:clamp(26px,5vw,34px);font-weight:600;line-height:1.15}
.who p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.tot{font-size:15px;color:var(--ink2);font-weight:600}
.tot b{color:var(--g7);font-size:20px}

.next{display:flex;gap:18px;align-items:center;margin:0 0 26px;padding:16px 18px;background:var(--surface);border:1px solid var(--line2);border-left:5px solid var(--gold);border-radius:10px}
.next .big{flex:none;text-align:center;min-width:74px;border-right:1px solid var(--line);padding-right:18px}
.next .big b{display:block;font-family:var(--serif);font-size:38px;font-weight:600;color:var(--g7);line-height:1}
.next .big span{display:block;margin-top:4px;font-size:13px;color:var(--ink2);font-weight:700}
.next h3{margin:0 0 2px;font-size:16px;font-weight:800}
.next p{margin:0;font-size:15px;color:var(--ink2)}

.day{margin-top:30px}
.dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line2)}
.dn{font-family:var(--serif);font-size:44px;font-weight:600;line-height:.95;color:var(--g7);min-width:52px}
.dt b{display:block;font-size:17px;font-weight:800;line-height:1.3}
.dt span{display:block;font-size:14px;color:var(--ink2)}
.tag{margin-left:auto;font-size:13px;font-weight:800;padding:4px 10px;border-radius:6px;background:var(--gold);color:var(--g9)}
.tag.done{background:var(--chip);color:var(--ink2)}
.day.past .dn{color:var(--mut)}

.duty{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 20px;padding:16px 18px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.duty .time b{display:block;font-size:15px;font-weight:800}
.duty .time span{display:block;font-size:14px;color:var(--ink2)}
.room{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.room b{font-size:22px;font-weight:800;line-height:1.2}
.room span{font-size:14px;color:var(--ink2)}
.role{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;padding:3px 10px;border-radius:6px;background:var(--chip);color:var(--g7)}
.role.res{background:#FFF1D6;color:#7A5200}
.crs{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink2)}
.crs li{padding:2px 0}
.meta{margin-top:6px;font-size:14px;color:var(--ink2)}
.meta b{color:var(--ink)}

.empty{padding:34px 10px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:4px}

.acts{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0 0}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--g7);color:var(--g7);background:var(--chip)}

footer{margin-top:44px;padding:26px 0 24px;background:#073f27;color:#DCE9E1;text-align:center;font-size:13px;line-height:1.8;border-top:3px solid var(--gold)}
footer .live{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:#fff}
footer .live:before{content:"";width:8px;height:8px;border-radius:50%;background:#5BE08F}

@media(max-width:620px){
  .duty{grid-template-columns:1fr}
  .find form{flex-direction:column}
  .find button{width:100%}
  .next{flex-direction:column;align-items:flex-start;gap:10px}
  .next .big{border-right:0;padding-right:0;text-align:left}
}
@media print{
  body{background:#fff}.find,.acts,footer .live{display:none}
  .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .duty,.day{break-inside:avoid}
}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="brand" id="brand"></div>
  <h1>Your invigilation duties</h1>
  <div class="sub" id="cyc"></div>
</div></header>

<div class="find"><div class="wrap">
  <form id="f" autocomplete="off">
    <input id="q" type="search" inputmode="search" placeholder="Employee code or name" aria-label="Employee code or name" autocapitalize="characters">
    <button id="go" type="submit">Show my duties</button>
  </form>
  <p class="hint">Type your employee code, or at least 3 letters of your name. The roster updates by itself while this page is open.</p>
</div></div>

<main class="wrap" id="out" aria-live="polite">
  <div class="note">Enter your employee code above to see the date, time and room of each duty.</div>
</main>

<footer><div class="wrap">
  <div class="live" id="live">Live roster</div><br>
  <span id="ft"></span><br>
  <span id="cp"></span>
</div></footer>

<script>var DATA = <?!= data ?>;</script>
<script>
(function(){
  var D = DATA || {}, M = D.meta || {};
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var cur = '', timer = null, busy = false, lastQ = '';
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
  function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function days(a,b){var x=a.split('-'),y=b.split('-');return Math.round((Date.UTC(+y[0],+y[1]-1,+y[2])-Date.UTC(+x[0],+x[1]-1,+x[2]))/864e5);}
  function initials(){var w=String(M.inst||'').split(/\s+/).filter(Boolean);return (w.length<2?String(M.inst||'').slice(0,3):w.slice(0,3).map(function(x){return x[0];}).join('')).toUpperCase();}

  $('brand').innerHTML=(M.logo?'<div class="crest"><img src="'+esc(M.logo)+'" alt=""></div>':'<div class="crest ini">'+esc(initials())+'</div>')+
    '<div><b>'+esc(M.inst||'')+'</b><span>Examination Office</span></div>';
  $('ft').textContent=M.footer||'Duties can change. This page shows the latest roster.';
  $('cp').textContent=M.copyright||'';
  document.title=(M.inst?M.inst+' - ':'')+'Invigilator Duties';

  function msg(t,bad){$('out').innerHTML='<div class="note'+(bad?' bad':'')+'">'+esc(t)+'</div>';}
  function setBusy(v){busy=v;$('go').disabled=v;}

  function look(q,silent){
    if(!(window.google&&google.script&&google.script.run)){if(!silent)msg('This page must be opened from the published web app link.',true);return;}
    if(busy&&silent)return;
    lastQ=q;
    if(!silent){setBusy(true);msg('Looking up your duties...');}
    google.script.run.withSuccessHandler(function(r){
      setBusy(false);
      if(!r||!r.ok){if(!silent)msg((r&&r.msg)||'Nothing found.',true);return;}
      $('cyc').textContent=[r.cycle&&r.cycle.type&&(r.cycle.type+' Examinations'),r.cycle&&r.cycle.term,r.cycle&&r.cycle.session].filter(Boolean).join(' - ');
      $('live').textContent='Live roster - checked '+(r.gen||'');
      if(r.matches){if(!silent)pickList(r);return;}
      cur=r.person.code;store('duty_code',cur);
      showPerson(r.person);
      if(timer)clearInterval(timer);
      timer=setInterval(function(){if(!document.hidden&&cur)look(cur,true);},120000);
    }).withFailureHandler(function(e){
      setBusy(false);
      if(!silent)msg('Could not load the roster: '+(e&&e.message?e.message:'try again in a minute.'),true);
    }).dutyLookup(q);
  }

  function pickList(r){
    var h='<div class="note">Several people match. Choose your name.</div><div class="pick">';
    r.matches.forEach(function(m){
      h+='<button type="button" data-c="'+esc(m.code)+'"><span><b>'+esc(m.name)+'</b><small>'+esc(m.code)+(m.dept?' - '+esc(m.dept):'')+'</small></span><em>'+m.n+(m.n===1?' duty':' duties')+'</em></button>';
    });
    $('out').innerHTML=h+'</div>'+(r.more?'<p class="hint">'+r.more+' more match. Type more of your name.</p>':'');
  }

  function fmt(k){var a=k.split('-');return {n:+a[2],m:MON[+a[1]-1],y:a[0]};}

  function showPerson(p){
    var t=today(), ds=p.duties||[];
    var head='<div class="who"><div><h2>'+esc(p.name)+'</h2><p>'+esc(p.code)+(p.dept?' - '+esc(p.dept):'')+'</p></div>'+
      '<div class="tot"><b>'+ds.filter(function(x){return x[4];}).length+'</b> duties</div></div>';
    if(!ds.length){
      $('out').innerHTML=head+'<div class="empty"><b>No duty assigned</b>No invigilation duty is on the roster for this code. If you expect one, ask the Examination Office.</div>'+acts();
      return;
    }
    var nx=null;for(var i=0;i<ds.length;i++){if(ds[i][0]>=t){nx=ds[i];break;}}
    var next='';
    if(nx){
      var df=days(t,nx[0]),f=fmt(nx[0]);
      next='<div class="next"><div class="big"><b>'+(df===0?'Today':df)+'</b><span>'+(df===0?'':(df===1?'day to go':'days to go'))+'</span></div><div>'+
        '<h3>Next duty: '+esc(nx[1])+', '+f.n+' '+f.m+'</h3><p>'+esc(nx[3]||nx[2])+(nx[4]?' - Room '+esc(nx[4])+(nx[5]?', '+esc(nx[5]):''):' - standby')+'</p></div></div>';
    }
    var byDay={},order=[];
    ds.forEach(function(x){if(!byDay[x[0]]){byDay[x[0]]=[];order.push(x[0]);}byDay[x[0]].push(x);});
    var out='';
    order.forEach(function(k){
      var f=fmt(k),first=byDay[k][0],past=k<t,isT=k===t;
      out+='<section class="day'+(past?' past':'')+'"><div class="dh"><div class="dn">'+f.n+'</div><div class="dt"><b>'+esc(first[1])+'</b><span>'+f.m+' '+f.y+'</span></div>'+
        (isT?'<span class="tag">TODAY</span>':(past?'<span class="tag done">DONE</span>':''))+'</div>';
      byDay[k].forEach(function(x){
        var res=!x[4], crs=x[6]?x[6].split(' | '):[];
        out+='<article class="duty"><div class="time"><b>'+esc(x[2])+'</b><span>'+esc(x[3])+'</span></div><div>'+
          (res?'<div class="room"><b>Standby</b><span>Be available if a replacement is needed</span></div>'
              :'<div class="room"><b>Room '+esc(x[4])+'</b>'+(x[5]?'<span>'+esc(x[5])+'</span>':'')+'</div>')+
          '<span class="role'+(res?' res':'')+'">'+esc(x[8])+'</span>'+
          (crs.length?'<ul class="crs">'+crs.map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul>':'')+
          (x[7]?'<div class="meta"><b>'+x[7]+'</b> students'+(x[9]?' - With: '+esc(x[9]):'')+'</div>':'')+
          '</div></article>';
      });
      out+='</section>';
    });
    $('out').innerHTML=head+next+out+acts();
  }

  function acts(){return '<div class="acts"><button class="btn" type="button" id="pr">Print or save as PDF</button><button class="btn" type="button" id="ch">Not you? Change code</button></div>';}

  $('out').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='pr'){window.print();return;}
    if(b.id==='ch'){cur='';store('duty_code','');if(timer)clearInterval(timer);$('q').value='';msg('Enter your employee code above to see the date, time and room of each duty.');$('q').focus();return;}
    if(b.getAttribute('data-c')){$('q').value=b.getAttribute('data-c');look(b.getAttribute('data-c'),false);}
  });
  $('f').addEventListener('submit',function(e){e.preventDefault();var q=$('q').value.trim();if(q)look(q,false);else msg('Type your employee code or your name.',true);});

  var start=D.e||store('duty_code')||'';
  if(start){$('q').value=start;look(start,false);}
})();
</script>
</body>
</html>
